<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Entrenamiento - Fuerza y Salud</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-primary: #121824;
      --bg-card: #1e2638;
      --accent: #ff4b4b;
      --accent-hover: #e03e3e;
      --text-main: #f0f4f8;
      --text-muted: #94a3b8;
      --border-color: #2e3a52;
      --success: #10b981;
      --video-btn: #ef4444;
      --info-bg: rgba(56, 189, 248, 0.1);
      --highlight: #38bdf8;
      --week-active: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      padding-bottom: 30px;
    }

    header {
      background-color: var(--bg-card);
      padding: 12px 15px;
      text-align: center;
      border-bottom: 2px solid var(--accent);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .top-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .user-weight-box, .week-selector-box {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--bg-primary);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      font-size: 0.82rem;
    }

    .user-weight-box input, .week-selector-box select {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--accent);
      color: white;
      font-weight: bold;
      text-align: center;
      font-size: 0.85rem;
    }

    .week-selector-box select {
      color: var(--week-active);
      cursor: pointer;
    }

    .day-selector {
      display: flex;
      justify-content: space-between;
      background-color: var(--bg-card);
      padding: 8px 4px;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
    }

    .day-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 8px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      flex: 1;
      margin: 0 2px;
      font-size: 0.75rem;
      white-space: nowrap;
    }

    .day-btn.active {
      background-color: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .container {
      padding: 0 10px;
      max-width: 600px;
      margin: 0 auto;
    }

    .exercise-card, .metrics-card {
      background-color: var(--bg-card);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid var(--border-color);
    }

    .exercise-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
      gap: 10px;
    }

    .exercise-title {
      font-size: 1.02rem;
      font-weight: bold;
      color: white;
    }

    .video-link {
      background-color: var(--video-btn);
      color: white;
      text-decoration: none;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
      white-space: nowrap;
    }

    .exercise-info {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .calc-weight-tag {
      font-size: 0.8rem;
      color: var(--highlight);
      background-color: var(--info-bg);
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .calc-weight-tag input {
      width: 48px;
      padding: 2px 4px;
      background: var(--bg-primary);
      border: 1px solid var(--highlight);
      color: white;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
    }

    .set-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      background-color: rgba(255, 255, 255, 0.03);
      padding: 6px 10px;
      border-radius: 6px;
    }

    .set-label {
      font-size: 0.85rem;
      font-weight: bold;
      width: 60px;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    input[type="number"], input[type="date"] {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: white;
      padding: 6px;
      border-radius: 6px;
      text-align: center;
      font-size: 0.9rem;
    }

    input[type="number"] {
      width: 65px;
    }

    input[type="checkbox"] {
      width: 22px;
      height: 22px;
      accent-color: var(--success);
      cursor: pointer;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .metric-row label {
      font-size: 0.88rem;
      color: var(--text-main);
    }

    .photo-upload-box {
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
    }

    .photo-input-group {
      margin-bottom: 12px;
    }

    .photo-input-group label {
      display: block;
      font-size: 0.82rem;
      color: var(--highlight);
      margin-bottom: 4px;
    }

    .photo-input-group input[type="file"] {
      font-size: 0.78rem;
      color: var(--text-muted);
      width: 100%;
    }

    .photo-preview-grid {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .photo-preview-grid img {
      width: 30%;
      height: 90px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-save {
      background-color: var(--success);
      color: white;
    }

    .btn-reset {
      background-color: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    .history-log {
      margin-top: 25px;
      background-color: var(--bg-card);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .history-log h3 {
      font-size: 0.95rem;
      margin-bottom: 10px;
      color: var(--accent);
    }

    .history-item {
      font-size: 0.8rem;
      border-bottom: 1px solid var(--border-color);
      padding: 6px 0;
      color: var(--text-muted);
    }

    .history-item:last-child {
      border-bottom: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.75rem;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 6px 4px;
      text-align: center;
    }

    th {
      background-color: var(--bg-primary);
      color: var(--highlight);
    }

    .diff-badge {
      font-size: 0.68rem;
      padding: 2px 4px;
      border-radius: 4px;
      margin-left: 2px;
    }
    .diff-down { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    .diff-up { background: rgba(255, 75, 75, 0.2); color: #ff4b4b; }

    .progress-photos-card {
      background: var(--bg-primary);
      padding: 10px;
      border-radius: 8px;
      margin-top: 15px;
      border: 1px solid var(--border-color);
    }
  </style>
</head>
